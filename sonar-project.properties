# SonarCloud configuration for wanli-backend project
sonar.projectKey=wanli-backend
sonar.organization=wuning-vip
sonar.projectName=wanli-backend
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# Language
sonar.language=java
sonar.java.source=17
sonar.java.target=17

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusions
sonar.exclusions=**/*Test.java,**/*Tests.java,**/target/**,**/node_modules/**
sonar.test.exclusions=**/*Test.java,**/*Tests.java

# Host URL (will be set automatically for SonarCloud)
sonar.host.url=https://sonarcloud.io

# Token will be provided via environment variable SONAR_TOKEN
# sonar.login will be set via CLI or environment variable