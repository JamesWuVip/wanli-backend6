name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, staging ]
  pull_request:
    branches: [ main, dev, staging ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  # Code Quality Checks
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Compile
      run: mvn clean compile -B
    
    - name: Run Checkstyle
      run: mvn checkstyle:check -B
      continue-on-error: true
    
    - name: Run PMD
      run: mvn pmd:check -B
      continue-on-error: true
    
    - name: Run SpotBugs
      run: mvn spotbugs:check -B
      continue-on-error: true
    
    - name: Upload Checkstyle Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: checkstyle-results
        path: target/checkstyle-result.xml
        retention-days: 30
    
    - name: Upload PMD Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pmd-results
        path: target/pmd.xml
        retention-days: 30
    
    - name: Upload SpotBugs Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-results
        path: target/spotbugsXml.xml
        retention-days: 30
    
    - name: Quality Gate Summary
      if: always()
      run: |
        echo "## 📊 Code Quality Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if quality reports exist and add status
        if [ -f target/checkstyle-result.xml ]; then
          CHECKSTYLE_ERRORS=$(grep -c "<error" target/checkstyle-result.xml || echo "0")
          echo "- **Checkstyle**: $CHECKSTYLE_ERRORS violations found" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f target/pmd.xml ]; then
          PMD_VIOLATIONS=$(grep -c "<violation" target/pmd.xml || echo "0")
          echo "- **PMD**: $PMD_VIOLATIONS violations found" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f target/spotbugsXml.xml ]; then
          SPOTBUGS_BUGS=$(grep -c "<BugInstance" target/spotbugsXml.xml || echo "0")
          echo "- **SpotBugs**: $SPOTBUGS_BUGS potential bugs found" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📁 Detailed reports are available in the artifacts section." >> $GITHUB_STEP_SUMMARY

  # Unit and Integration Tests
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: wanli_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Wait for MySQL
      run: |
        for i in {30..0}; do
          if mysqladmin ping -h"127.0.0.1" -P3306 -uroot -ptestpassword --silent; then
            break
          fi
          echo 'MySQL is unavailable - sleeping'
          sleep 2
        done
        
        if [ "$i" = 0 ]; then
          echo 'MySQL is still unavailable - exiting'
          exit 1
        fi
        
        echo 'MySQL is up - continuing'
    
    - name: Wait for Redis
      run: |
        for i in {30..0}; do
          if redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG; then
            break
          fi
          echo 'Redis is unavailable - sleeping'
          sleep 2
        done
        
        if [ "$i" = 0 ]; then
          echo 'Redis is still unavailable - exiting'
          exit 1
        fi
        
        echo 'Redis is up - continuing'
    
    - name: Run Unit Tests
      run: mvn test -B
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/wanli_test
        SPRING_DATASOURCE_USERNAME: testuser
        SPRING_DATASOURCE_PASSWORD: testpassword
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379
    
    - name: Run Integration Tests
      run: mvn verify -B -DskipUnitTests=true
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/wanli_test
        SPRING_DATASOURCE_USERNAME: testuser
        SPRING_DATASOURCE_PASSWORD: testpassword
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379
    
    - name: Generate JaCoCo Report
      run: mvn jacoco:report -B
    
    - name: JaCoCo Coverage Check
      run: mvn jacoco:check -B
      continue-on-error: true
    
    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ env.CODECOV_TOKEN }}
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/site/jacoco/
        retention-days: 30
    
    - name: Test Summary
      if: always()
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Unit test results
        if [ -d target/surefire-reports ]; then
          UNIT_TESTS=$(find target/surefire-reports -name "*.xml" -exec grep -l "<testsuite" {} \; | wc -l)
          UNIT_FAILURES=$(find target/surefire-reports -name "*.xml" -exec grep -o 'failures="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{sum += $1} END {print sum+0}')
          UNIT_ERRORS=$(find target/surefire-reports -name "*.xml" -exec grep -o 'errors="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{sum += $1} END {print sum+0}')
          echo "- **Unit Tests**: $UNIT_TESTS suites, $UNIT_FAILURES failures, $UNIT_ERRORS errors" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Integration test results
        if [ -d target/failsafe-reports ]; then
          IT_TESTS=$(find target/failsafe-reports -name "*.xml" -exec grep -l "<testsuite" {} \; | wc -l)
          IT_FAILURES=$(find target/failsafe-reports -name "*.xml" -exec grep -o 'failures="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{sum += $1} END {print sum+0}')
          IT_ERRORS=$(find target/failsafe-reports -name "*.xml" -exec grep -o 'errors="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{sum += $1} END {print sum+0}')
          echo "- **Integration Tests**: $IT_TESTS suites, $IT_FAILURES failures, $IT_ERRORS errors" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Coverage results
        if [ -f target/site/jacoco/index.html ]; then
          echo "- **Code Coverage**: Report generated (see artifacts)" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 Detailed test reports and coverage information are available in the artifacts section." >> $GITHUB_STEP_SUMMARY

  # Security Scans
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run Snyk Security Scan
      uses: snyk/actions/maven@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --file=pom.xml
    
    - name: Upload Snyk Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: snyk.sarif
    
    - name: OWASP Dependency Check
      run: |
        mvn org.owasp:dependency-check-maven:check -B
      continue-on-error: true
    
    - name: Upload OWASP Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owasp-dependency-check
        path: target/dependency-check-report.html
        retention-days: 30
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java
        queries: security-and-quality
    
    - name: Build for CodeQL
      run: mvn clean compile -B
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
    
    - name: Run Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Security Summary
      if: always()
      run: |
        echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Snyk**: Dependency vulnerability scan completed" >> $GITHUB_STEP_SUMMARY
        echo "- **OWASP**: Dependency check completed" >> $GITHUB_STEP_SUMMARY
        echo "- **CodeQL**: Static analysis completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Trivy**: Filesystem scan completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🛡️ Check the Security tab for detailed vulnerability results." >> $GITHUB_STEP_SUMMARY

  # SonarQube Analysis
  sonarqube:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run Tests for SonarQube
      run: mvn clean test -B
      env:
        SPRING_PROFILES_ACTIVE: test
    
    - name: SonarCloud Analysis
      run: |
        mvn clean verify sonar:sonar -B \
          -Dsonar.projectKey=JamesWuVip_wanli-backend6 \
          -Dsonar.organization=jameswuvip \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=${{ env.SONAR_TOKEN }} \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
    
    - name: SonarQube Quality Gate Check
      uses: sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      continue-on-error: true
    
    - name: SonarQube Summary
      if: always()
      run: |
        echo "## 📈 SonarQube Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Project**: wanli-backend6" >> $GITHUB_STEP_SUMMARY
        echo "- **Analysis**: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Quality Gate**: Check SonarCloud dashboard" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [View detailed results on SonarCloud](https://sonarcloud.io/project/overview?id=JamesWuVip_wanli-backend6)" >> $GITHUB_STEP_SUMMARY

  # Performance Testing
  performance:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: wanli_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build Application
      run: mvn clean package -DskipTests -B
    
    - name: Start Application
      run: |
        java -jar target/*.jar --spring.profiles.active=test &
        APP_PID=$!
        echo "APP_PID=$APP_PID" >> $GITHUB_ENV
        
        # Wait for application to start
        echo "Waiting for application to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "Application started successfully"
            break
          fi
          echo "Attempt $i: Application not ready yet, waiting..."
          sleep 10
        done
        
        if ! curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
          echo "Application failed to start within timeout"
          exit 1
        fi
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/wanli_test
        SPRING_DATASOURCE_USERNAME: testuser
        SPRING_DATASOURCE_PASSWORD: testpassword
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379
    
    - name: Install Artillery
      run: npm install -g artillery@latest
    
    - name: Run Performance Tests
      run: |
        # Create Artillery test configuration
        cat > load-test.yml << EOF
        config:
          target: 'http://localhost:8080'
          phases:
            - duration: 60
              arrivalRate: 5
              name: "Warm up"
            - duration: 120
              arrivalRate: 10
              name: "Ramp up load"
            - duration: 300
              arrivalRate: 20
              name: "Sustained load"
          processor: "./load-test-functions.js"
        scenarios:
          - name: "Health Check"
            weight: 30
            flow:
              - get:
                  url: "/actuator/health"
          - name: "API Endpoints"
            weight: 70
            flow:
              - get:
                  url: "/api/users/profile"
                  headers:
                    Authorization: "Bearer test-token"
        EOF
        
        # Create test functions
        cat > load-test-functions.js << EOF
        module.exports = {
          setAuthToken: function(requestParams, context, ee, next) {
            requestParams.headers = requestParams.headers || {};
            requestParams.headers['Authorization'] = 'Bearer test-token';
            return next();
          }
        };
        EOF
        
        artillery run load-test.yml --output performance-report.json
    
    - name: Generate Performance Report
      run: |
        artillery report performance-report.json --output performance-report.html
        
        # Extract key metrics
        echo "## 🚀 Performance Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Parse results (basic extraction)
        if [ -f performance-report.json ]; then
          echo "Performance test completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "Detailed report available in artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "Performance test failed or no results generated" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload Performance Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-reports
        path: |
          performance-report.json
          performance-report.html
        retention-days: 30
    
    - name: Stop Application
      if: always()
      run: |
        if [ ! -z "$APP_PID" ]; then
          kill $APP_PID || true
        fi

  # Container Build and Security Scan
  container-security:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build Application
      run: mvn clean package -DskipTests
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker Image
      run: |
        docker build -t wanli-backend:${{ github.sha }} .
        docker tag wanli-backend:${{ github.sha }} wanli-backend:latest
    
    - name: Run Trivy Container Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'wanli-backend:latest'
        format: 'sarif'
        output: 'trivy-container-results.sarif'
    
    - name: Upload Trivy Container Scan Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-container-results.sarif'
    
    - name: Run Container Structure Test
      run: |
        # Install container-structure-test
        curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
        chmod +x container-structure-test-linux-amd64
        sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
        
        # Create test configuration
        cat > container-test.yaml << EOF
        schemaVersion: 2.0.0
        
        commandTests:
          - name: "Java version check"
            command: "java"
            args: ["-version"]
            expectedError: ["openjdk version"]
        
        fileExistenceTests:
          - name: "Application JAR exists"
            path: "/app/app.jar"
            shouldExist: true
        
        metadataTest:
          exposedPorts: ["8080"]
          workdir: "/app"
        EOF
        
        # Run tests
        container-structure-test test --image wanli-backend:latest --config container-test.yaml
    
    - name: Container Security Summary
      if: always()
      run: |
        echo "## 🐳 Container Security Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Trivy**: Container vulnerability scan completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Structure Test**: Container structure validation completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check the Security tab for detailed vulnerability results." >> $GITHUB_STEP_SUMMARY

  # Deploy to Development Environment
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [code-quality, test, security, sonarqube]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build JAR
      run: mvn clean package -DskipTests -Dspring.profiles.active=dev
    
    - name: Deploy to Railway (Dev)
      run: |
        curl -fsSL https://railway.app/install.sh | sh
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway environment dev
        railway up --service ${{ secrets.RAILWAY_SERVICE_NAME_DEV }}
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: Run database migrations
      run: |
        railway run --service ${{ secrets.RAILWAY_SERVICE_NAME_DEV }} -- \
          mvn flyway:migrate \
          -Dflyway.url=${{ secrets.DEV_DATABASE_URL }} \
          -Dflyway.user=${{ secrets.DEV_DB_USERNAME }} \
          -Dflyway.password=${{ secrets.DEV_DB_PASSWORD }}
    
    - name: Health check
      run: |
        sleep 30
        curl -f ${{ secrets.DEV_APP_URL }}/api/actuator/health || exit 1

  # Deploy to Staging Environment
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [code-quality, test, security, sonarqube, performance, container-security]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build JAR
      run: mvn clean package -DskipTests -Dspring.profiles.active=staging
    
    - name: Deploy to Railway (Staging)
      run: |
        curl -fsSL https://railway.app/install.sh | sh
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway environment staging
        railway up --service ${{ secrets.RAILWAY_SERVICE_NAME_STAGING }}
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: Run database migrations
      run: |
        railway run --service ${{ secrets.RAILWAY_SERVICE_NAME_STAGING }} -- \
          mvn flyway:migrate \
          -Dflyway.url=${{ secrets.STAGING_DATABASE_URL }} \
          -Dflyway.user=${{ secrets.STAGING_DB_USERNAME }} \
          -Dflyway.password=${{ secrets.STAGING_DB_PASSWORD }}
    
    - name: Health check
      run: |
        sleep 30
        curl -f ${{ secrets.STAGING_APP_URL }}/api/actuator/health || exit 1
    
    - name: Run E2E tests
      run: |
        # 这里可以添加端到端测试
        echo "Running E2E tests against staging environment"
        # mvn test -Dtest=E2ETest -Dapp.url=${{ secrets.STAGING_APP_URL }}
    
    - name: Performance tests
      run: |
        # 这里可以添加性能测试
        echo "Running performance tests"
        # 可以使用 JMeter 或其他性能测试工具

  # Deploy to Production Environment
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [code-quality, test, security, sonarqube, performance, container-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build JAR
      run: mvn clean package -DskipTests -Dspring.profiles.active=prod
    
    - name: Deploy to Railway (Production)
      run: |
        curl -fsSL https://railway.app/install.sh | sh
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway environment production
        railway up --service ${{ secrets.RAILWAY_SERVICE_NAME_PROD }}
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: Run database migrations
      run: |
        railway run --service ${{ secrets.RAILWAY_SERVICE_NAME_PROD }} -- \
          mvn flyway:migrate \
          -Dflyway.url=${{ secrets.PROD_DATABASE_URL }} \
          -Dflyway.user=${{ secrets.PROD_DB_USERNAME }} \
          -Dflyway.password=${{ secrets.PROD_DB_PASSWORD }}
    
    - name: Health check
      run: |
        sleep 30
        curl -f ${{ secrets.PROD_APP_URL }}/api/actuator/health || exit 1
    
    - name: Notify deployment
      if: success()
      run: |
        echo "Production deployment successful!"
        # 这里可以添加 Slack 通知或其他通知方式
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"🚀 Production deployment successful!"}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}